<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monochrome Hub // Liquid Glass Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(120, 120, 120, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
        }

        .liquid-glass {
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .liquid-card {
            background: rgba(22, 22, 22, 0.55);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .liquid-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.35);
            border-top-color: rgba(255, 255, 255, 0.6);
            background: rgba(30, 30, 30, 0.7);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
        }

        .liquid-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            text-decoration: none;
        }

        .liquid-btn:hover {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .cat-tab {
            background: rgba(18, 18, 18, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .cat-tab.active, .cat-tab:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="flex flex-col relative min-h-screen">

    <div class="liquid-bg"></div>

    <!-- Header -->
    <header class="w-full liquid-glass sticky top-0 z-50 px-4 sm:px-8 py-4 border-x-0 border-t-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3.5 group cursor-pointer" onclick="setCategory('all'); document.getElementById('searchInput').value=''; filterSoftware();">
                <div class="w-11 h-11 rounded-2xl bg-black/40 backdrop-blur-md flex items-center justify-center border border-white/20 text-white text-xl group-hover:scale-105 transition-transform duration-200 shadow-lg">
                    <i class="fa-solid fa-cloud"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl text-white tracking-wide flex items-center space-x-2">
                        <span>Repositório Despa</span>
                        <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded-full border border-white/20 text-zinc-300 font-bold backdrop-blur-sm">BETA</span>
                    </h1>
                    <p class="text-[11px] text-zinc-400 font-medium">Repositório de Softwares & Utilitários</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-8 py-8 relative z-10">

        <div class="liquid-glass rounded-3xl p-8 sm:p-12 mb-8 text-center relative overflow-hidden shadow-2xl">
            <div class="absolute -right-20 -bottom-20 w-64 h-64 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>

              

        </div>

        <!-- Controls / Search / Filter -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterSoftware()" placeholder="Pesquisar programa..." class="w-full bg-black/40 backdrop-blur-xl text-white placeholder-zinc-500 pl-11 pr-4 py-3 rounded-2xl border border-white/10 focus:outline-none focus:border-white/40 text-sm font-medium transition-all shadow-inner">
            </div>

            <div class="flex items-center space-x-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-none">
                <button onclick="setCategory('all')" id="btn-all" class="cat-tab active px-4 py-2.5 rounded-2xl text-xs font-semibold whitespace-nowrap cursor-pointer backdrop-blur-md">Todos</button>
                <button onclick="setCategory('suporte')" id="btn-suporte" class="cat-tab px-4 py-2.5 rounded-2xl text-xs font-semibold whitespace-nowrap cursor-pointer backdrop-blur-md">Conexão</button>
                <button onclick="setCategory('produtividade')" id="btn-produtividade" class="cat-tab px-4 py-2.5 rounded-2xl text-xs font-semibold whitespace-nowrap cursor-pointer backdrop-blur-md">Produtividade</button>
                <button onclick="setCategory('utilitarios')" id="btn-utilitarios" class="cat-tab px-4 py-2.5 rounded-2xl text-xs font-semibold whitespace-nowrap cursor-pointer backdrop-blur-md">Utilitários</button>
                <button onclick="setCategory('seguranca')" id="btn-seguranca" class="cat-tab px-4 py-2.5 rounded-2xl text-xs font-semibold whitespace-nowrap cursor-pointer backdrop-blur-md">Segurança</button>
            </div>
        </div>

        <!-- Software Grid -->
        <div id="softwareGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Dynamic Cards -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 liquid-glass rounded-3xl mt-4 border border-white/10 shadow-xl">
            <div class="w-14 h-14 bg-black/40 backdrop-blur-md rounded-full flex items-center justify-center mx-auto mb-3 text-white text-xl border border-white/20 shadow-inner">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-base font-bold text-white mb-1">Nenhum software encontrado</h3>
            <p class="text-zinc-400 text-xs">Tente buscar por outro termo ou categoria.</p>
        </div>
    </main>

    <script>
        // Banco de Dados com Links Diretos/Drive e Ícones Externos
        const softwareList = [
            {
                id: 1,
                name: "Instalador",
                category: "suporte",
                version: "v5.8.2",
                size: "430 MB",
                downloads: 1,
                icon: "https://i.imgur.com/cYQhTUR.png",
                downloadLink: "https://github.com/despaassistance-eng/despa/releases/download/despa/5.8.2.9.exe",
                description: "Ferramenta de assistência remota rápida e segura para suporte técnico e colaboração."
            },
            {
                id: 2,
                name: "AnyDesk",
                category: "produtividade",
                version: "v5.5.3",
                size: "3.8 MB",
                downloads: 2,
                icon: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/anydesk.webp",
                downloadLink: "https://raw.githubusercontent.com/despaassistance-eng/despa/main/AnyDesk.exe",
                description: "Acesso remoto rápido, seguro e leve para computadores e servidores."
            },
            {
                id: 3,
                name: "TeamViewer",
                category: "utilitarios",
                version: "Atual",
                size: "Indefinido",
                downloads: 3,
                icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/webp/teamviewer-light.webp",
                downloadLink: "https://download.teamviewer.com/download/TeamViewer_Setup.exe",
                description: "Solução global para acesso remoto e suporte técnico online."
            },
            {
                id: 4,
                name: "SDK 12",
                category: "seguranca",
                version: "v12.0",
                size: "61.1 MB",
                downloads: 4,
                icon: "https://www.wscfc.com.br/assets/IMAGENSCLIENTESSITES/29232941000132/DOWNLOADS/2C2ANZ.png",
                downloadLink: "https://github.com/despaassistance-eng/despa/releases/download/despa/SDK.12.exe",
                description: "Proteção avançada em tempo real contra ameaças e monitoramento de rede."
            },
            {
                id: 5,
                name: "Cloudflare / 1.1.1.1",
                category: "produtividade",
                version: "Atual",
                size: "Indefinido",
                downloads: 5,
                icon: "https://upload.wikimedia.org/wikipedia/commons/9/94/Cloudflare_Logo.png",
                downloadLink: "https://1111-releases.cloudflareclient.com/windows/Cloudflare_WARP_Release-x64.msi",
                description: "Sincronizador automático de arquivos com armazenamento seguro na nuvem."
            },
            {
                id: 6,
                name: "VC Redist",
                category: "seguranca",
                version: "Indefinido",
                size: "11.6 MB",
                downloads: 6,
                icon: "https://img.utdstc.com/icon/d34/a74/d34a74281538887e01059f9801d0a1f14bfcebc6eb10a6371e5a97be500f0bb8:100",
                downloadLink: "https://raw.githubusercontent.com/despaassistance-eng/despa/main/VC_redist.exe",
                description: "Gerenciador de senhas altamente criptografado para máxima segurança local."
            },
            {
                id: 7,
                name: "Pasta de DLL's",
                category: "seguranca",
                version: "Indefinido",
                size: "119 MB",
                downloads: 7,
                icon: "https://img.icons8.com/parakeet/48/dll.png",
                downloadLink: "https://github.com/despaassistance-eng/despa/releases/download/despa/Pasta.DLL.zip",
                description: "Gerenciador de senhas altamente criptografado para máxima segurança local."
            },
            {
                id: 8,
                name: "Scanner de DLL's",
                category: "seguranca",
                version: "v1.8.4",
                size: "11.6 MB",
                downloads: 8,
                icon: "https://img.icons8.com/?size=100&id=pfB8ihEIPcSD&format=png&color=000000",
                downloadLink: "https://raw.githubusercontent.com/despaassistance-eng/despa/main/Verificar%20DLL.exe",
                description: "Gerenciador de senhas altamente criptografado para máxima segurança local."
            },
            {
                id: 9,
                name: "Scanner de AntiVírus",
                category: "seguranca",
                version: "v1.8.4",
                size: "11.6 MB",
                downloads: 9,
                icon: "https://img.icons8.com/?size=100&id=14891&format=png&color=000000",
                downloadLink: "https://raw.githubusercontent.com/despaassistance-eng/despa/main/Antivirus.zip",
                description: "Gerenciador de senhas altamente criptografado para máxima segurança local."
            }
        ];

        let currentCategory = 'all';

        function renderSoftware(items) {
            const grid = document.getElementById('softwareGrid');
            const emptyState = document.getElementById('emptyState');

            grid.innerHTML = '';

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            items.forEach(app => {
                const card = document.createElement('div');
                card.className = 'liquid-card rounded-3xl p-6 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between mb-4">
                            <div class="w-12 h-12 rounded-2xl bg-black/40 backdrop-blur-md flex items-center justify-center p-2 border border-white/20 shadow-inner">
                                <img src="${app.icon}" alt="${app.name}" class="w-full h-full object-contain rounded-xl">
                            </div>
                            <span class="text-[11px] bg-black/40 backdrop-blur-md px-2.5 py-1 rounded-full border border-white/10 text-zinc-300 font-semibold shadow-inner">
                                ${app.version}
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-white mb-2">${app.name}</h3>
                        <p class="text-zinc-400 text-xs mb-6 leading-relaxed">${app.description}</p>
                    </div>
                    <div>
                        <div class="flex items-center justify-between text-[11px] text-zinc-400 font-medium mb-4 px-0.5">
                            <span><i class="fa-solid fa-file-arrow-down mr-1 text-zinc-500"></i> ${app.size}</span>
                            <span><i class="fa-solid fa-cell mr-1 text-zinc-500"></i> ${app.downloads} ID</span>
                        </div>
                        <a href="${app.downloadLink}" target="_blank" class="liquid-btn w-full py-2.5 rounded-xl text-xs font-bold flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-download text-zinc-300"></i>
                            <span>Baixar Software</span>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${category}`).classList.add('active');
            filterSoftware();
        }

        function filterSoftware() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = softwareList.filter(app => {
                const matchesCat = currentCategory === 'all' || app.category === currentCategory;
                const matchesQuery = app.name.toLowerCase().includes(query) || app.description.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderSoftware(filtered);
        }

        window.onload = function() {
            renderSoftware(softwareList);
        };
    </script>
</body>
</html>
